# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  # undertow 配置
  undertow:
    # HTTP post内容的最大大小。当值为-1时，默认值为大小是无限的
    max-http-post-size: 1GB
    # 以下的配置会影响buffer,这些buffer会用于服务器连接的IO操作,有点类似netty的池化内存管理
    # 每块buffer的空间大小,越小的空间被利用越充分
    buffer-size: 512
    # 是否分配的直接内存
    direct-buffers: true
    threads:
      # 设置IO线程数, 它主要执行非阻塞的任务,它们会负责多个连接, 默认设置每个CPU核心一个线程
      io: 8
      # 阻塞任务线程池, 当执行类似servlet请求阻塞操作, undertow会从这个线程池中取得线程,它的值设置取决于系统的负载
      worker: 256

captcha:
  # 是否启用验证码校验
  enable: true
  # 验证码类型 math 数组计算 char 字符验证
  type: math
  # 数字验证码位数
  numberLength: 1
  # 字符验证码长度
  charLength: 4

# 日志配置
logging:
  level:
    org.dromara: @logging.level@
    org.springframework: warn
    org.mybatis.spring.mapper: error
    org.apache.fury: warn
  config: classpath:logback-plus.xml

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  application:
    name: RuoYi-Vue-Plus
  threads:
    # 开启虚拟线程 仅jdk21可用
    virtual:
      enabled: false
  task:
    execution:
      # 从 springboot 3.5 开始 spring自带线程池
      # 不再需要 AsyncConfig与ThreadPoolConfig 可直接注入线程池使用
      thread-name-prefix: async-
      # 由spring自己初始化线程池
      mode: force
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: @profiles.active@
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  mvc:
    # 设置静态资源路径 防止所有请求都去查静态资源
    static-path-pattern: /static/**
    format:
      date-time: yyyy-MM-dd HH:mm:ss
  jackson:
    # 日期格式化
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      # 格式化输出
      indent_output: false
      # 忽略无法转换的对象
      fail_on_empty_beans: false
    deserialization:
      # 允许对象忽略json中不存在的属性
      fail_on_unknown_properties: false

# Sa-Token配置
sa-token:
  # token名称 (同时也是cookie名称)
  token-name: Authorization
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
  is-share: false
  # jwt秘钥
  jwt-secret-key: abcdefghijklmnopqrstuvwxyz

# security配置
security:
  # 排除路径
  excludes:
    - /*.html
    - /**/*.html
    - /**/*.css
    - /**/*.js
    - /favicon.ico
    - /error
    # Document Server 回读待转换源文件的出口（按短时 token 放行，见 PdfSourceController）
    - /report/pdf-source/**
    - /*/api-docs
    - /*/api-docs/**
    # 接口文档界面（knife4j）：doc.html 与它的静态资源（js/css/字体/图片）都要放行，否则页面白屏
    - /doc.html
    - /webjars/**
    - /swagger-ui/**
    - /swagger-ui.html

# MyBatisPlus配置
# https://baomidou.com/config/
mybatis-plus:
  # 自定义配置 是否全局开启逻辑删除 关闭后 所有逻辑删除功能将失效
  enableLogicDelete: true
  # 多包名使用 例如 org.dromara.**.mapper,org.xxx.**.mapper
  mapperPackage: org.dromara.**.mapper
  # 对应的 XML 文件位置
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: org.dromara.**.domain
  global-config:
    dbConfig:
      # 主键类型
      # AUTO 自增 NONE 空 INPUT 用户输入 ASSIGN_ID 雪花 ASSIGN_UUID 唯一 UUID
      # 本项目：所有表的主键列已设成 AUTO_INCREMENT（复合主键的表用 @TableId(type = INPUT) 显式传值），
      # 所以这里必须同步改成 AUTO —— 与 ruoyi-common-mybatis 的 common-mybatis.yml 同项保持一致。
      idType: AUTO

# 数据加密
mybatis-encryptor:
  # 是否开启加密
  enable: false
  # 默认加密算法
  algorithm: BASE64
  # 编码方式 BASE64/HEX。默认BASE64
  encode: BASE64
  # 安全秘钥 对称算法的秘钥 如：AES，SM4
  password:
  # 公私钥 非对称算法的公私钥 如：SM2，RSA
  publicKey:
  privateKey:

# api接口加密
api-decrypt:
  # 是否开启全局接口加密
  enabled: true
  # AES 加密头标识
  headerFlag: encrypt-key
  # 响应加密公钥 非对称算法的公私钥 如：SM2，RSA 使用者请自行更换
  # 对应前端解密私钥 
  publicKey: MFwwDQYJKoZIhvcNAQEBBQADSwAwSAJBAJnNwrj4hi/y3CCJu868ghCG5dUj8wZK++RNlTLcXoMmdZWEQ/u02RgD5LyLAXGjLOjbMtC+/J9qofpSGTKSx/MCAwEAAQ==
  # 请求解密私钥 非对称算法的公私钥 如：SM2，RSA 使用者请自行更换
  # 对应前端加密公钥 MFwwDQYJKoZIhvcNAQEBBQADSwAwSAJBAKoR8mX0rGKLqzcWmOzbfj64K8ZIgOdHnzkXSOVOZbFu/TJhZ7rFAN+eaGkl3C4buccQd/EjEsj9ir7ijT7h96MCAwEAAQ==
  privateKey: 

springdoc:
  api-docs:
    # 是否开启接口文档
    enabled: true
  info:
    # 标题
    title: '标题：RuoYi-Vue-Plus单实例RBAC管理系统_接口文档'
    # 描述
    description: '描述：用于管理集团旗下公司的人员信息,具体包括XXX,XXX模块...'
    # 版本
    version: '版本号: ${project.version}'
    # 作者信息
    contact:
      name: Lion Li
      email: crazylionli@163.com
      url: https://gitee.com/dromara/RuoYi-Vue-Plus
  #这里定义了多个分组，可按模块扩展
  group-configs:
    - group: 1.通用模块
      packages-to-scan: org.dromara.web
    - group: 2.系统模块
      packages-to-scan: org.dromara.system
    - group: 3.代码生成模块
      packages-to-scan: org.dromara.generator
    # 业务模块（原来没分组，接口全落在「默认分组」里、界面上看不到 —— 实测补上后才选得到）
    - group: 4.质控模块
      packages-to-scan: org.dromara.qc
    - group: 5.报告模块
      packages-to-scan: org.dromara.report
    - group: 6.项目管理
      packages-to-scan: org.dromara.project
    - group: 7.合规管理
      packages-to-scan: org.dromara.compliance

# 接口文档界面说明（不需要额外配置，只列在这里备查）
#   /swagger-ui/index.html  springdoc 自带 UI（与生成器同版本）
#   /doc.html               knife4j 中文界面（knife4j-openapi3-ui 纯静态包，文档内容仍由 springdoc 生成）
#   两者都要求 security.excludes 里放行它们的静态资源（见上）
# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接
  excludeUrls:
    - /system/notice

--- # 分布式锁 lock4j 全局配置
lock4j:
  # 获取分布式锁超时时间，默认为 3000 毫秒
  acquire-timeout: 3000
  # 分布式锁的超时时间，默认为 30 秒
  expire: 30000

--- # Actuator 监控端点的配置项
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: ALWAYS
    logfile:
      external-file: ./logs/sys-console.log

--- # 默认/推荐使用sse推送
sse:
  enabled: true
  path: /resource/sse

--- # websocket
websocket:
  # 如果关闭 需要和前端开关一起关闭
  enabled: false
  # 路径
  path: /resource/websocket
  # 设置访问源地址
  allowedOrigins: '*'

---
# 合规管理（CSV / 3Q）
compliance:
  dev-log:
    # 开发记录的「记录文档」附件存放目录（服务器固定目录）。
    # 只存一份：同名文件上传即替换；库里仅记原始文件名，不存路径。
    # 生产请把该目录挂成持久化卷（deploy.sh 里已把宿主 files/ 挂到 /ruoyi/server/upload）。
    upload-dir: /ruoyi/server/upload/compliance/dev-log
  validation-record:
    # 3Q 验证记录的「验证文档」附件存放目录（规则同上）
    upload-dir: /ruoyi/server/upload/compliance/validation-record
  compliance-doc:
    # 3Q 文档管理的「文档」附件存放目录（规则同上）
    upload-dir: /ruoyi/server/upload/compliance/compliance-doc

--- # OnlyOffice 文档转换（DOCX -> PDF）
# 只影响「转换」这一附加能力：Document Server 抖动时通知单照常生成，只是 pdf_path 留空。
onlyoffice:
  # 关闭后完全不调 Document Server
  enabled: true
  # Document Server 地址（后端直连它的地址）
  ds-url: http://127.0.0.1:18098
  # Document Server 回读源文件的基址，必须是「Document Server 能访问到的后端地址」。
  # 留空 = 不转换（只记一条 warn）。部署时用环境变量覆盖：ONLYOFFICE_PUBLIC_BASE
  public-base:
  # 单次转换超时（秒）
  timeout-seconds: 180
  # 源文件临时凭证有效期（秒）
  source-ttl-seconds: 600

--- # 报告签名通道：stub = 假实现（只落状态链，不连通道，离线联调用）；ssq = 真实上上签（报告交付场景）
# 默认 stub：本地/测试环境不依赖上上签网关也能跑通「签名中 → 已签名 → 发送」；
# 生产用 ssq（见 application-prod.yml），任何环境都可用环境变量 REPORT_SIGN_PROVIDER 覆盖。
# 三个个人签署人固定「刘尚智 / 18034334041」（见 SsqSignServiceImpl.PERSON_SIGNERS）。
report:
  sign:
    provider: ${REPORT_SIGN_PROVIDER:stub}

--- # 数据驱动入库（ruoyi-drive）：生信流程上传完成后主动调用，同步返回最终状态与文件数
# 这里只放与环境无关的共用默认值；**上传根目录按环境放在 application-dev.yml / application-prod.yml**
# （驱动路径是本机 /tmp/rp-upload、生产外部大盘，天然按环境分叉，不要塞回共用文件）。
# 外部调用走固定 token（见下方 api.token.paths）。
drive:
  # 审计字段 create_by（sys_user.user_id）与执行人姓名（写 analysis_data.drive_executed_by）
  create-by: 1
  operator-name: tumor
  # 明细批量插入每批行数 / analysis_file_status.file_text 最多保留字符数
  batch-insert-size: 500
  file-text-max-length: 1048576

--- # 固定 token 的接口调用：外部系统（生信流程 / 脚本）推数据时不用登录换 access_token
# 调用方在请求头带 X-Api-Token: *** paths 时，服务端按 account 的身份执行本次请求：
# @SaCheckPermission 走该账号的角色、create_by 记该账号。
# 数据归属租户 = account 这个用户的 tenant_id（一个药企一个用户一个 token）；
# account 是平台账号（tenant_id=000000，如历史的 tumor）时，qc 接口回退到按样本解析租户。
api:
  token:
    enabled: true
    # 固定 token：换密钥改这里（或部署时用环境变量 API_TOKEN 覆盖，避免把生产密钥写进仓库）
    value: ${API_TOKEN:ff7176eff4faa47d993d79fb63f974f2}
    # 以哪个账号的身份执行；账号需自行创建并授权（建议给足权限，接口点位见 BioinfoQcController）
    account: tumor
    # 生效路径（Ant 风格）；别的模块接入往下加一条即可，不用改代码
    paths:
      - /qc/bioinfo/receive
      - /qc/wetLabQc/receive
      - /report/drive/**
    # 调用方没带 clientid 请求头时使用的客户端编号（sys_client.client_key）
    clientId: e5cd7e4891bf95d1d19206ce24a7b32e
    # 多账号（2026-10-29）：一条 = 一个固定 token 对应用一个账号 + 它自己的生效路径。
    # 数据库备份脚本（宿主 backupctl）用 sys_backup，角色只授 backup:db:report，
    # 不继承上面 tumor 的权限；换密钥用环境变量 API_TOKEN_BACKUP 覆盖。
    tokens:
      - value: ${API_TOKEN_BACKUP:9f3c7a1e5b2d4806af17c9e3b6d05a74}
        account: sys_backup
        paths:
          - /backup/**
        clientId: e5cd7e4891bf95d1d19206ce24a7b32e
      # 药企专属 token（推荐口径）：account 是「某个药企下的用户」，该用户的 tenant_id
      # 就是数据归属——推送的数据直接落到这个药企，不再按样本反查租户。
      # 一个药企配一条；换密钥用环境变量 API_TOKEN_SHENGYU 覆盖。
      - value: ${API_TOKEN_SHENGYU:7a1c9d2e4b8f4a13b6c5d0e7f9a2b4c6}
        account: shengyutest2
        paths:
          - /qc/bioinfo/receive
          - /qc/wetLabQc/receive
        clientId: e5cd7e4891bf95d1d19206ce24a7b32e

